services:
  redis:
    image: redis:7.4.9
    container_name: agent-harness-redis
    ports:
      - "127.0.0.1:16379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:13310:3306"
    environment:
      MYSQL_DATABASE: agent_harness
      MYSQL_USER: agent
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-agent-local-only}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  redis-data:
  mysql-data:
