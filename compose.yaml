services:
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:13310:3306"
    environment:
      MYSQL_DATABASE: agent_harness
      MYSQL_USER: agent
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-agent-local-only}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  mysql-data:
